<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE Smart Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f6f7fb;--sf:#ffffff;--sf2:#f8f9fd;--tx:#111827;--mu:#6b7280;
  --bd:#e5e7eb;--ac:#4f46e5;--ak:#eef2ff;--ok:#059669;--okb:#ecfdf5;
  --warn:#d97706;--warnb:#fffbeb;--err:#dc2626;--errb:#fef2f2;
  --sh:0 1px 2px rgba(17,24,39,.04),0 6px 20px rgba(17,24,39,.05);
  --fs:15.5px;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0b0f1d;--sf:#13182b;--sf2:#1a2138;--tx:#f3f4f6;--mu:#9ca3af;
  --bd:#242c47;--ac:#818cf8;--ak:#1e244d;--ok:#34d399;--okb:rgba(16,185,129,.12);
  --warn:#fbbf24;--warnb:rgba(245,158,11,.12);--err:#f87171;--errb:rgba(239,68,68,.12);
  --sh:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
input,select,textarea{font:inherit;color:var(--tx)}

/* App Shell */
.app{display:flex;min-height:100vh}
.side{width:284px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:10px 20px}
.content{max-width:880px;width:100%;margin:0 auto;padding:24px 22px 90px;animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}}

/* Sidebar */
.s-head{padding:14px 14px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.brand-badge{width:30px;height:30px;border-radius:9px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:15px}
.s-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px 12px 6px}
.s-tab{padding:7px 4px;border-radius:9px;font-size:12px;font-weight:700;text-align:center;color:var(--mu);background:var(--sf2);transition:.14s}
.s-tab.on{background:var(--ak);color:var(--ac)}
.s-search{padding:6px 12px 10px}
.s-search input{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--sf2);font-size:13px;outline:none}
.s-search input:focus{border-color:var(--ac);background:var(--sf)}
.s-list{flex:1;overflow-y:auto;padding:4px 10px 20px}
.ch-item{width:100%;text-align:left;padding:8px 10px;border-radius:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.12s}
.ch-item:hover{background:var(--sf2)}
.ch-item.on{background:var(--ak);color:var(--ac);font-weight:700}
.ch-dot{width:7px;height:7px;border-radius:50%;background:var(--bd);flex-shrink:0}
.ch-dot.ready{background:var(--ok)}

/* 3-dots dropdown */
.dots-menu{position:absolute;top:52px;right:12px;width:230px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,.16);padding:6px;display:none;z-index:35}
.dots-menu.open{display:block}
.dm-item{width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.1s}
.dm-item:hover{background:var(--sf2);color:var(--ac)}

/* Controls */
.ib{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:.14s;white-space:nowrap}
.ib:hover{border-color:var(--ac)}
.ib.on{background:var(--ak);color:var(--ac);border-color:var(--ac)}
.ib.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.ib.primary:hover{filter:brightness(1.06)}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:0 0 9px;box-shadow:var(--sh);transition:.15s}
.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn.center{justify-content:center;font-weight:700;background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.center:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.tag{font-size:11px;font-weight:700;background:var(--ak);color:var(--ac);padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}
.tag.warn{background:var(--warnb);color:var(--warn)}

/* Home */
h1{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:4px 0 6px;line-height:1.2}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin:24px 0 10px;font-weight:700}
small,.mu{color:var(--mu)}
small{display:block;font-size:12.5px}
.search-bar{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);box-shadow:var(--sh);outline:none;margin:14px 0 20px}
.search-bar:focus{border-color:var(--ac)}
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sub-card{display:flex;flex-direction:column;justify-content:space-between;min-height:126px;padding:18px;border-radius:16px;background:color-mix(in srgb,var(--sc) 9%,var(--sf));border:1px solid color-mix(in srgb,var(--sc) 26%,var(--bd));text-align:left;transition:.15s;box-shadow:var(--sh)}
.sub-card:hover{border-color:var(--ac);transform:translateY(-2px)}
.sub-card .ic{font-size:28px}
.sub-card b{font-size:17px;display:block;margin-bottom:2px}
.empty-home{background:var(--sf);border:1px dashed var(--bd);border-radius:16px;padding:22px;text-align:center;margin-top:18px}

/* Note Workspace */
#pb{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ac);z-index:40;transition:width .08s}
.note-head{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px 22px;box-shadow:var(--sh);margin-bottom:16px}
.note-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.note-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--bd);padding-bottom:10px}
.ntab{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mu);background:var(--sf);border:1px solid var(--bd);transition:.14s}
.ntab:hover{border-color:var(--ac);color:var(--tx)}
.ntab.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;box-shadow:var(--sh);margin-bottom:14px}
.card-title{font-size:14px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.rd{font-size:var(--fs);line-height:1.72}
.rd ul{margin:0;padding-left:20px}
.rd li{margin:0 0 8px}

/* Formula 2-column grid */
.f-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.f-card{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.f-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.2em 0!important}

/* Split Insights vs Traps */
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.callout-ok{background:var(--okb);border:1px solid color-mix(in srgb,var(--ok) 28%,var(--bd));border-radius:16px;padding:16px 18px}
.callout-warn{background:var(--warnb);border:1px solid color-mix(in srgb,var(--warn) 32%,var(--bd));border-radius:16px;padding:16px 18px}

/* Visual Diagram Box */
.svg-stage{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;justify-content:center;align-items:center;margin-bottom:12px;overflow:hidden}
:root[data-theme=dark] .svg-stage{background:#0f1528}
.svg-stage svg{max-width:100%;height:auto;max-height:300px}

/* Personal Scratchpad & Image Snaps */
.scratch{width:100%;min-height:120px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf2);resize:vertical;outline:none;line-height:1.6}
.scratch:focus{border-color:var(--ac);background:var(--sf)}
.dropzone{border:1.5px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;background:var(--sf2);margin-top:10px;transition:.15s}
.dropzone:hover{border-color:var(--ac)}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.img-tile{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--sf2);aspect-ratio:4/3}
.img-tile img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.img-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:99px;background:rgba(0,0,0,.68);color:#fff;font-size:12px;display:grid;place-items:center}

/* AI Tutor Chat with Memory */
.chat-log{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding:4px 2px}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6}
.bubble.u{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bubble.a{align-self:flex-start;background:var(--sf2);border:1px solid var(--bd);border-bottom-left-radius:4px}
.bubble img{max-width:220px;border-radius:8px;margin-top:6px;display:block}
.tutor-row{display:flex;gap:8px;align-items:center}
.tutor-row input[type=text]{flex:1;padding:10px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);outline:none}
.tutor-row input[type=text]:focus{border-color:var(--ac);background:var(--sf)}

/* Practice Quiz & Flashcards */
.mcq{border-top:1px solid var(--bd);padding:12px 0}
.mcq:first-child{border-top:none;padding-top:2px}
.mcq-opt{display:block;width:100%;text-align:left;padding:9px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);font-size:14px;transition:.12s}
.mcq-opt:hover{border-color:var(--ac)}
.mcq-opt.good{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.mcq-opt.bad{background:var(--errb);border-color:var(--err);color:var(--err)}
.fc-card{background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px;transition:.15s}
.fc-card:hover{border-color:var(--ac)}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

/* Modals & Toast */
.modal-bg{position:fixed;inset:0;background:rgba(11,15,29,.6);backdrop-filter:blur(4px);z-index:50;display:none;place-items:center;padding:16px}
.modal-bg.open{display:grid}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:18px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto}
.modal h3{margin:0 0 6px;font-size:18px}
.field{margin:12px 0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin-bottom:5px}
.field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);outline:none}
.field input:focus,.field select:focus{border-color:var(--ac);background:var(--sf)}
.pbar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ac) 18%,var(--sf));overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .35s}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat-card{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:center}
.stat-card b{font-size:19px;display:block}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 15px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.nv{display:flex;gap:8px;margin-top:10px}.nv .btn{margin:0}

/* Responsive & Print */
.mob-only{display:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19}
@media(max-width:860px){
  .side{position:fixed;left:-295px;transition:left .2s ease;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  .side.open{left:0}
  .overlay.open{display:block}
  .mob-only{display:inline-flex}
  .subs,.split-grid{grid-template-columns:1fr}
}
@media print{
  .side,.topbar,.note-tabs,.nv,#pb,#t{display:none!important}
  .content{max-width:100%;padding:0}
  .card,.note-head{box-shadow:none;border:1px solid #ddd}
}
</style>

window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'none'},startup:{typeset:false}};
function tj(){var M=window.MathJax;if(!M||!M.startup||!M.startup.promise)return;M.startup.promise.then(function(){M.typesetClear();return M.typesetPromise([document.getElementById('main')])}).catch(function(){})}

<body>
<div id="pb"></div>
<div class="overlay" id="ov" data-a="menu:0"></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar" id="top"></header>
    <main class="content" id="main"></main>
  </div>
</div>

<!-- Secondary / Library Modal -->
<div class="modal-bg" id="libMdl">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 id="libTitle">Library &amp; Progress</h3>
      <button class="ib" data-a="closeMdl:libMdl">✕</button>
    </div>
    <div id="libBody"></div>
  </div>
</div>

<!-- Image Lightbox -->
<div class="modal-bg" id="imgMdl" data-a="closeMdl:imgMdl">
  <img id="imgFull" alt="Diagram preview" style="max-width:92vw;max-height:88vh;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)">
</div>

<!-- Sign-In Modal -->
<div class="modal-bg" id="authMdl">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Student Sign In</h3>
      <button class="ib" data-a="closeMdl:authMdl">✕</button>
    </div>
    <small>Your notes, diagrams, tutor chats, and revision progress are saved under your profile.</small>
    <div class="field">
      <label for="uName">Your Name</label>
      <input type="text" id="uName" placeholder="e.g. Rohit">
    </div>
    <div class="field">
      <label for="uEmail">Email</label>
      <input type="email" id="uEmail" placeholder="rohit@example.com">
    </div>
    <div class="field">
      <label for="uTarget">Target Exam</label>
      <select id="uTarget">
        <option value="JEE 2027">JEE 2027</option>
        <option value="JEE 2028">JEE 2028</option>
        <option value="JEE Dropper">JEE Dropper</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="ib primary" style="flex:1;justify-content:center" data-a="doSignIn">Continue</button>
      <button class="ib" data-a="doSignOut" id="signOutBtn" style="display:none">Sign out</button>
    </div>
  </div>
</div>

<div id="t"></div>

<script>
const TREE=[
{id:'phy',n:'Physics',c:'Units and Measurements|Motion in a Straight Line|Motion in a Plane|Laws of Motion|Friction and Circular Motion|Work Energy and Power|Centre of Mass and Collisions|Rotational Motion|Gravitation|Mechanical Properties of Solids|Mechanical Properties of Fluids|Thermal Properties of Matter|Thermodynamics|Kinetic Theory of Gases|Oscillations|Waves|Electrostatics|Capacitance|Current Electricity|Moving Charges and Magnetism|Magnetism and Matter|Electromagnetic Induction|Alternating Current|Electromagnetic Waves|Ray Optics|Wave Optics|Dual Nature of Radiation and Matter|Atoms|Nuclei|Semiconductor Electronics|Experimental Skills'.split('|').map(n=>({n}))},
{id:'che',n:'Chemistry',c:'Some Basic Concepts of Chemistry|Atomic Structure|States of Matter|Solid State|Chemical Thermodynamics|Chemical Equilibrium|Ionic Equilibrium|Redox Reactions|Solutions|Electrochemistry|Chemical Kinetics|Surface Chemistry|Periodic Table and Periodicity|Chemical Bonding|Hydrogen and s-Block Elements|p-Block Elements (Groups 13–14)|p-Block Elements (Groups 15–18)|d- and f-Block Elements|Coordination Compounds|Metallurgy|Environmental Chemistry|Qualitative Salt Analysis|Basic Principles of Organic Chemistry|Isomerism|Hydrocarbons|Haloalkanes and Haloarenes|Alcohols Phenols and Ethers|Aldehydes and Ketones|Carboxylic Acids and Derivatives|Amines|Biomolecules and Polymers'.split('|').map(n=>({n}))},
{id:'mat',n:'Mathematics',c:'Sets and Relations|Functions|Complex Numbers|Quadratic Equations|Sequences and Series|Permutations and Combinations|Binomial Theorem|Matrices|Determinants|Trigonometric Ratios and Identities|Trigonometric Equations|Inverse Trigonometric Functions|Properties of Triangles|Straight Lines|Circles|Parabola|Ellipse|Hyperbola|Limits|Continuity and Differentiability|Differentiation|Application of Derivatives|Indefinite Integration|Definite Integration|Area Under Curves|Differential Equations|Vector Algebra|Three-Dimensional Geometry|Probability|Statistics|Mathematical Reasoning'.split('|').map(n=>({n}))}
];

const IC={phy:['⚛️','#4f46e5'],che:['🧪','#059669'],mat:['📐','#d97706']};
const IV=[1,3,7,14,30],D=864e5;
const N={},T={};

let USER=null;
try{USER=JSON.parse(localStorage.getItem('jee_user')||'null')}catch(e){}
const skey=()=>USER&&USER.email?('jee_u4_'+USER.email.toLowerCase()):'jee_v4_guest';

let S={};
function loadState(){
  S={};
  try{S=JSON.parse(localStorage.getItem(skey())||'{}')}catch(e){}
  S.b=S.b||[];S.r=S.r||[];S.p=S.p||{};S.fs=S.fs||15.5;
  S.g=S.g||{};S.gn=S.gn||{};S.my=S.my||{};S.imgs=S.imgs||{};S.chats=S.chats||{};
  Object.keys(N).forEach(k=>delete N[k]);
  Object.keys(T).forEach(k=>delete T[k]);
  TREE.forEach(s=>s.c.forEach((c,i)=>{c.ids=[];if(S.g[s.id+i])reg(s.id,i)}));
}
const sv=()=>{try{localStorage.setItem(skey(),JSON.stringify(S))}catch(e){toast('Storage nearly full — export backup or remove large images')}};
const cl=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const due=id=>S.p[id]&&S.p[id].d<=Date.now();
const H=document.documentElement;

function reg(id,i){
  const s=TREE.find(x=>x.id==id),c=s.c[i],L=S.g[id+i]||[];
  c.ids=L.map((n,k)=>{
    const d=id+i+'-'+k;
    T[d]={id:d,n,sib:[],p:`${s.n} › ${c.n}`,x:`${s.n} ${c.n} ${n}`.toLowerCase()};
    if(S.gn[d]){N[d]=S.gn[d];T[d].x+=' '+Object.values(N[d]).flat().join(' ').toLowerCase()}
    return d;
  });
  c.ids.forEach(d=>T[d].sib=c.ids);
}
loadState();
if(S.th)H.dataset.theme=S.th;else if(matchMedia('(prefers-color-scheme:dark)').matches)H.dataset.theme='dark';
H.style.setProperty('--fs',S.fs+'px');

let cur=['home'],st=[],sideSub='phy',sideQ='',noteTab='notes',dotsOpen=false,tt;
let pomo={sec:25*60,on:false,iv:null};
let quizCache={},flashCache={},flashIdx={},flashFlip={},cheatCache={},pendingChatImg=null;

const toast=m=>{const e=document.getElementById('t');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1800)};
const gr=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
const fmtT=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

function parseJsonSafe(txt){
  const clean=String(txt).replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
  try{return JSON.parse(clean)}
  catch(e){return JSON.parse(clean.replace(/\\(?!["\\/bfnrtu])/g,'\\\\'))}
}

function sanitizeSvg(raw){
  if(!raw||typeof raw!=='string')return '';
  const m=raw.match(/<svg[\s\S]*?<\/svg>/i);
  if(!m)return '';
  return m[0].replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=\s*["'][^"']*["']/gi,'');
}

/* All Gemini requests go through the same-origin Cloudflare Worker.
   The API key never enters browser JavaScript or localStorage. */
async function callAI(payload,jsonMode=true,schema=null,signal=null){
  const body=typeof payload==='string'
    ? {prompt:payload,jsonMode,schema}
    : {...payload,jsonMode,schema};

  let res;
  try{
    res=await fetch('/api/gemini',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal
    });
  }catch(e){
    if(e.name==='AbortError')throw e;
    throw new Error('Could not reach the AI service. Check your connection and try again.');
  }

  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    if(res.status===500 && /GEMINI_API_KEY/i.test(data.error||'')){
      throw new Error('The AI service has not been configured by the site owner yet.');
    }
    throw new Error(data.error||('AI service error ('+res.status+').'));
  }
  if(typeof data.text!=='string'||!data.text.trim()){
    throw new Error('The AI service returned an empty response. Please try again.');
  }
  return jsonMode?parseJsonSafe(data.text):data.text;
}

function bH(){
  const{ch,chd,tot,ok}=bT(),p=tot?Math.round(ok/tot*100):0,fin=chd>=ch&&ok>=tot;
  return `<p style="margin:6px 0 8px"><b>${fin?'All chapters loaded ✓':'Batch-load JEE syllabus'}</b></p>

  <div class=pbar><i style="width:${p}%"></i></div>

  ${fin?'':`<button class="btn center" style="margin-top:12px" data-a=${BK.on?'bs':'bl'}>${BK.on?'Stop batch':ok||BK.fail.length?'Resume loading':'Load all chapters'}</button>`}`;
}
const drawBulk=()=>{const e=document.getElementById('bkModal');if(e)e.innerHTML=bH()};

async function bulk(){
  if(BK.on)return;
  BK.on=true;BK.fail=[];BK.msg='';BK.cur=[];BK.ctl=new AbortController();drawBulk();
  const q=[];TREE.forEach(s=>s.c.forEach((c,i)=>{if(!c.ids||!c.ids.length||c.ids.some(d=>!N[d]))q.push([s,i,c])}));
  while(q.length&&!BK.ctl.signal.aborted){
    const[s,i,c]=q.shift();BK.cur=[c.n];drawBulk();
    try{
      if(!c.ids||!c.ids.length){
        const L=await callAI(`List ALL important JEE Main & Advanced topics of "${c.n}" (${s.n}) in syllabus order (8 to 14 topics). Return only a JSON array of topic names.`,true,TOPIC_LIST_SCHEMA,BK.ctl.signal);
        if(Array.isArray(L)&&L.length){S.g[s.id+i]=L.map(cl);reg(s.id,i);sv();renderSide()}
      }
      for(const d of (c.ids||[])){
        if(BK.ctl.signal.aborted)break;
        if(!N[d])await fetchNoteSilent(d,BK.ctl.signal);
      }
    }catch(e){
      if(e.name==='AbortError')break;
      BK.fail.push(c.n);BK.msg=e.message;
      if(/Deploy on Cloudflare/i.test(e.message))break;
    }
    sv();renderSide();drawBulk();
  }
  BK.on=false;BK.cur=[];sv();renderSide();drawBulk();
}

/* Image Compression Helper for Paste/Upload */
function handleImageFile(file,cb){
  if(!file||!file.type.startsWith('image/'))return;
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',0.78));
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

          <label class="ib" style="cursor:pointer" title="Attach image">📎<input type="file" id="chatImgUp" accept="image/*" style="display:none"></label>
          <input type="text" id="tinp" placeholder="Ask a follow-up doubt about ${esc(t.n)}…">
          <button class="ib primary" data-a="ask:${id}">Send</button>
        </div>
      </div>`;
  }
  tj();
}

function note(id){
  if(!N[id]){genNote(id);return `<small>${T[id].p}</small><h1>${T[id].n}</h1><div class="card"><p class="mu" id="gs" style="margin:0">Generating complete notes &amp; diagram…</p></div>`}
  const t=T[id],i=t.sib.indexOf(id),pv=t.sib[i-1],nx=t.sib[i+1];
  return `
  <div class="note-head">
    <small>${t.p}</small>
    <h1 style="margin:4px 0 0">${t.n}</h1>
    <div class="note-meta">
      <span class="tag ${S.p[id]?'ok':''}">${S.p[id]?'Revised ✓':'Active Study'}</span>
      <button class="ib primary" id="rv" data-a="rv:${id}">${S.p[id]?'Log Next Review':'Mark as Revised ✓'}</button>
    </div>
  </div>
  <div class="note-tabs">
    <button class="ntab${noteTab=='notes'?' on':''}" data-a="ntab:${id}:notes">📖 Study Notes</button>
    <button class="ntab${noteTab=='diagrams'?' on':''}" data-a="ntab:${id}:diagrams">📐 Diagrams &amp; My Notes</button>
    <button class="ntab${noteTab=='practice'?' on':''}" data-a="ntab:${id}:practice">🎯 Quiz &amp; Flashcards</button>
    <button class="ntab${noteTab=='tutor'?' on':''}" data-a="ntab:${id}:tutor">💬 AI Tutor (${(S.chats[id]||[]).length})</button>
  </div>
  <div id="noteBody"></div>
  <div class="nv">${pv?`<button class="btn" data-a="n:${pv}">‹ ${T[pv].n}</button>`:''}${nx?`<button class="btn" data-a="n:${nx}">${T[nx].n} ›</button>`:''}</div>`;
}

function render(){
  const[v,a,b]=cur;
  renderSide();renderTop();
  document.getElementById('main').innerHTML=({home,subj,chap,note})[v](a,b);
  scrollTo(0,0);
  if(v=='note'){
    S.r=[a,...S.r.filter(i=>i!=a)].slice(0,8);sv();
    if(N[a])renderNoteSubTab(a);
  }
  pg();tj();
}

const go=(...v)=>{st.push(cur);cur=v;render()};
const pg=()=>{const m=H.scrollHeight-innerHeight;document.getElementById('pb').style.width=(cur[0]=='note'&&m>0?scrollY/m*100:0)+'%'};

function openLib(tab){
  dotsOpen=false;renderSide();
  const ttl=document.getElementById('libTitle'),body=document.getElementById('libBody');
  if(tab==='stats'){
    const all=Object.keys(T),ready=all.filter(i=>N[i]).length,done=all.filter(i=>S.p[i]).length,dl=all.filter(due);
    ttl.textContent='Progress & Bookmarks';
    body.innerHTML=`<div class="stats-grid">
      <div class="stat-card"><b>${ready}</b><small>Ready</small></div>
      <div class="stat-card"><b>${done}</b><small>Revised</small></div>
      <div class="stat-card"><b>${dl.length}</b><small>Due</small></div>
    </div>
    <h2>Due for review</h2>${dl.length?dl.map(row).join(''):'<small>Nothing due today.</small>'}
    <h2>Bookmarks</h2>${S.b.filter(i=>T[i]).length?S.b.filter(i=>T[i]).map(row).join(''):'<small>Tap ☆ in any note to save it here.</small>'}`;
  }else if(tab==='bulk'){
    ttl.textContent='Batch-Load Chapters';
    body.innerHTML=`<div id="bkModal">${bH()}</div>`;
  }else{
    ttl.textContent='Export / Import Library';
    body.innerHTML=`<small style="margin:6px 0 12px">Back up your drafted notes, diagrams, tutor chats, and revision progress as JSON.</small>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ib primary" data-a="exportLib">⬇ Export JSON</button>
      <label class="ib" style="cursor:pointer">⬆ Import JSON<input type="file" id="imp" accept=".json" style="display:none"></label>
    </div>`;
    setTimeout(()=>{
      const imp=document.getElementById('imp');
      if(imp)imp.onchange=e=>{
        const f=e.target.files[0];if(!f)return;
        const fr=new FileReader();
        fr.onload=()=>{try{S=Object.assign(S,JSON.parse(fr.result));sv();loadState();render();document.getElementById('libMdl').classList.remove('open');toast('Library imported ✓')}catch(err){toast('Invalid backup file')}};
        fr.readAsText(f);
      };
    },0);
  }
  document.getElementById('libMdl').classList.add('open');
}

const AC={
  home:()=>{cur=['home'];render();AC.menu('0')},
  s:x=>{sideSub=x;go('subj',x);AC.menu('0')},
  stab:x=>{sideSub=x;renderSide()},
  c:x=>{const[a,b]=x.split(':');sideSub=a;go('chap',a,+b);AC.menu('0')},
  n:x=>{document.getElementById('libMdl').classList.remove('open');if(cur[0]=='note'){cur=['note',x];render()}else go('note',x);AC.menu('0')},
  bk:()=>{cur=st.pop()||['home'];render()},
  menu:x=>{document.getElementById('side').classList.toggle('open',x==='1');document.getElementById('ov').classList.toggle('open',x==='1')},
  dots:()=>{dotsOpen=!dotsOpen;renderSide()},
  openLib:x=>openLib(x),
  closeMdl:x=>document.getElementById(x).classList.remove('open'),
  openAuth:()=>{
    document.getElementById('uName').value=USER?USER.name:'';
    document.getElementById('uEmail').value=USER?USER.email:'';
    document.getElementById('uTarget').value=USER?USER.target:'JEE 2027';
    document.getElementById('signOutBtn').style.display=USER?'inline-flex':'none';
    document.getElementById('authMdl').classList.add('open');
  },
  doSignIn:()=>{
    const name=document.getElementById('uName').value.trim(),email=document.getElementById('uEmail').value.trim(),target=document.getElementById('uTarget').value;
    if(!name){toast('Enter your name');return}
    USER={name,email:email||name.toLowerCase().replace(/\s+/g,''),target};
    try{localStorage.setItem('jee_user',JSON.stringify(USER))}catch(e){}
    loadState();document.getElementById('authMdl').classList.remove('open');render();toast('Signed in as '+name);
  },
  doSignOut:()=>{
    USER=null;try{localStorage.removeItem('jee_user')}catch(e){}
    loadState();document.getElementById('authMdl').classList.remove('open');render();toast('Signed out');
  },
  th:()=>{S.th=H.dataset.theme==='dark'?'light':'dark';H.dataset.theme=S.th;dotsOpen=false;sv();renderSide()},
  fs:x=>{S.fs=Math.max(13,Math.min(24,S.fs+ +x));H.style.setProperty('--fs',S.fs+'px');sv();pg()},
  print:()=>window.print(),
  bm:x=>{S.b=S.b.includes(x)?S.b.filter(i=>i!=x):[x,...S.b];sv();renderTop();toast(S.b.includes(x)?'Bookmarked ★':'Removed bookmark')},
  rv:(x,t)=>{const p=S.p[x]||{n:0};p.n++;const d=IV[Math.min(p.n-1,4)];p.d=Date.now()+d*D;S.p[x]=p;sv();toast('Locked in! Next review in '+d+'d 🎉');render()},
  tp:(x,t)=>{const[id,i]=x.split(':');genTopicList(id,i,t)},
  rt:x=>genNote(x),
  bl:()=>bulk(),
  bs:()=>{if(BK.ctl)BK.ctl.abort()},
  ntab:x=>{const[id,tab]=x.split(':');noteTab=tab;document.querySelectorAll('.ntab').forEach((p,i)=>p.classList.toggle('on',['notes','diagrams','practice','tutor'][i]===tab));renderNoteSubTab(id)},
  qz:x=>genQuiz(x),
  fc:x=>genFlash(x),
  ch:x=>genCheat(x),
  fcFlip:x=>{flashFlip[x]=!flashFlip[x];renderNoteSubTab(x)},
  fcStep:x=>{const[id,dir]=x.split(':'),f=flashCache[id];if(!f)return;flashIdx[id]=(flashIdx[id]+ +dir+f.length)%f.length;flashFlip[id]=false;renderNoteSubTab(id)},
  ask:x=>askTutor(x),
  clrChat:x=>{delete S.chats[x];sv();renderNoteSubTab(x)},
  clrChatImg:()=>{pendingChatImg=null;if(cur[0]==='note')renderNoteSubTab(cur[1])},
  delImg:x=>{const[id,idx]=x.split(':');if(S.imgs[id]){S.imgs[id].splice(+idx,1);sv();renderNoteSubTab(id)}},
  zoomImg:x=>{const id=cur[1],src=S.imgs[id]&&S.imgs[id][+x];if(src){document.getElementById('imgFull').src=src;document.getElementById('imgMdl').classList.add('open')}},
  ans:x=>{
    const[id,qi,oi]=x.split(':'),q=quizCache[id]&&quizCache[id][+qi];if(!q)return;
    const wrap=document.querySelector(`.mcq[data-qi="${qi}"]`);if(!wrap)return;
    wrap.querySelectorAll('.mcq-opt').forEach((b,idx)=>{b.disabled=true;if(idx===q.ans)b.classList.add('good');else if(idx===+oi)b.classList.add('bad')});
    const ex=document.getElementById('exp-'+qi);if(ex){ex.style.display='block';ex.innerHTML=`<b>Explanation:</b> ${cl(q.exp)}`}
    tj();
  },
  cp:(x,t)=>{
    const s=t.dataset.t,ok=()=>toast('Formula copied (LaTeX)');
    function fb(){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Copy unavailable')}a.remove()}
    try{navigator.clipboard.writeText(s).then(ok,fb)}catch(e){fb()}
  },
  pomo:()=>{
    dotsOpen=false;
    if(pomo.on){clearInterval(pomo.iv);pomo.on=false;toast('Timer paused');renderSide();return}
    pomo.on=true;toast('25-min focus timer started ⏱');renderSide();
    pomo.iv=setInterval(()=>{
      pomo.sec--;
      if(pomo.sec<=0){clearInterval(pomo.iv);pomo.on=false;pomo.sec=25*60;toast('25-min study block complete! 🎉')}
      if(dotsOpen)renderSide();
    },1000);
  },
  exportLib:()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jee-smart-notes-backup.json';a.click();
  }
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(t){const[a,...r]=t.dataset.a.split(':');if(AC[a])AC[a](r.join(':'),t);return}
  if(dotsOpen&&!e.target.closest('#dotsMenu')){dotsOpen=false;renderSide()}
});

document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id=='scratch'&&cur[0]==='note'){S.my[cur[1]]=e.target.value;sv();return}
  if(id=='sq'){sideQ=e.target.value;renderSide();const inp=document.getElementById('sq');if(inp){inp.focus();inp.setSelectionRange(sideQ.length,sideQ.length)}return}
  if(id=='q'){
    const q=e.target.value.toLowerCase().trim().split(/\s+/).filter(Boolean),hm=document.getElementById('hm'),res=document.getElementById('res');
    if(!q.length){res.innerHTML='';hm.hidden=false;return}
    hm.hidden=true;
    const sc=t=>q.filter(w=>t.n.toLowerCase().includes(w)).length,r=Object.values(T).filter(t=>q.every(w=>t.x.includes(w))).sort((a,b)=>sc(b)-sc(a));
    res.innerHTML=`<h2>${r.length} result${r.length==1?'':'s'}</h2>`+(r.length?r.map(t=>row(t.id)).join(''):'<p class="mu">No matching notes yet. Pick a chapter from the sidebar to fetch topics.</p>');
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='imgUp'&&cur[0]==='note'){
    handleImageFile(e.target.files[0],url=>{S.imgs[cur[1]]=S.imgs[cur[1]]||[];S.imgs[cur[1]].push(url);sv();renderNoteSubTab(cur[1]);toast('Diagram added ✓')});
  }else if(e.target.id==='chatImgUp'&&cur[0]==='note'){
    handleImageFile(e.target.files[0],url=>{pendingChatImg=url;renderNoteSubTab(cur[1])});
  }
});

document.addEventListener('paste',e=>{
  if(cur[0]!=='note'||!N[cur[1]])return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of items){
    if(it.type.startsWith('image/')){
      const file=it.getAsFile();
      handleImageFile(file,url=>{
        if(noteTab==='tutor'){pendingChatImg=url;renderNoteSubTab(cur[1]);toast('Image attached to tutor chat')}
        else{S.imgs[cur[1]]=S.imgs[cur[1]]||[];S.imgs[cur[1]].push(url);noteTab='diagrams';sv();render();toast('Diagram pasted into note ✓')}
      });
      break;
    }
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tinp'&&cur[0]==='note')askTutor(cur[1])});
addEventListener('scroll',pg,{passive:true});
render();
</script>
</body>
</html>
